[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcode-harmony"
version = "0.1.0.dev0"
description = "Plug-and-play local GPT-OSS Harmony integration for dcode"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "MIT" }
dependencies = [
    "deepagents-code==0.1.80",
    "deepagents==0.7.21",
    "openai-harmony==0.0.8",
    "httpx>=0.28.1,<1",
]

[project.scripts]
dcode = "dcode_harmony.cli:main"

[project.entry-points."dcode.extensions"]
dcode_harmony = "dcode_harmony.extensions"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.16,<1",
    "ty>=0.0.84,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dcode_harmony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "live: requires external llama-server availability",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/dcode_harmony/providers/harmony.py" = ["TRY004"]
"tests/*" = ["TRY004"]
